# Safety net: asks Cloudflare Pages to rebuild every six hours even if WordPress
# never pinged it. Add CF_DEPLOY_HOOK as a repository secret (Settings, Secrets).
name: Scheduled rebuild
on:
  schedule: [{ cron: "17 */6 * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: '[ -n "$HOOK" ] && curl -fsS -X POST "$HOOK" || echo "CF_DEPLOY_HOOK not set"'
        env: { HOOK: "${{ secrets.CF_DEPLOY_HOOK }}" }
